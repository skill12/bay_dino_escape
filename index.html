<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0f14">
<title>아기 공룡 대탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{--ou:1px}
  html,body{margin:0;height:100%;background:#1a0f14;overflow:hidden;font-family:"Jua",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  body{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  img{pointer-events:none;-webkit-user-drag:none}
  button{touch-action:manipulation}
  #wrap{position:relative;--u:1px;flex:none}
  #topbar{display:none;width:100%;justify-content:flex-end;padding:8px 12px;box-sizing:border-box;flex:none}
  #pad{display:none;width:100%;box-sizing:border-box;padding:14px 14px 10px;gap:14px;flex-direction:column;flex:none}
  body.portrait #topbar, body.portrait #pad{display:flex}
  #padBtns{display:flex;gap:14px;flex:1}
  #pad button{flex:1;border:none;border-radius:28px;font-family:inherit;font-size:30px;color:#fff;touch-action:none;
    box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  #pad button small{font-size:15px;opacity:.85}
  #pJump{background:linear-gradient(#ffa94d,#f76707)}
  #pSlide{background:linear-gradient(#74c0fc,#1c7ed6)}
  #pad button.on{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35);filter:brightness(1.12)}
  #padTip{color:#ffcf99;font-size:15px;text-align:center}
  body.portrait #tb{position:static}
  canvas{display:block;width:100%;height:100%;touch-action:none;border-radius:calc(var(--ou)*10)}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;
      background:radial-gradient(ellipse at center,rgba(40,15,20,.55),rgba(20,8,12,.82));border-radius:calc(var(--ou)*10)}
  .hidden{display:none!important}
  h1{margin:0;font-weight:400;font-size:calc(var(--ou)*74);line-height:1.05;color:#ffe35c;
     text-shadow:0 calc(var(--ou)*5) 0 #d9480f,0 calc(var(--ou)*9) calc(var(--ou)*18) rgba(0,0,0,.5);letter-spacing:calc(var(--ou)*2)}
  h2{margin:0;font-weight:400;font-size:calc(var(--ou)*58);color:#fff;text-shadow:0 calc(var(--ou)*4) 0 #c2410c}
  .sub{font-size:calc(var(--ou)*24);margin:calc(var(--ou)*12) 0 calc(var(--ou)*16);color:#ffe9d6;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  .heads{display:flex;gap:calc(var(--ou)*12);align-items:flex-end;margin-bottom:calc(var(--ou)*18)}
  .heads img{width:calc(var(--ou)*64);height:calc(var(--ou)*64);border-radius:50%;object-fit:cover;border:calc(var(--ou)*4) solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.4)}
  .heads img.big{width:calc(var(--ou)*104);height:calc(var(--ou)*104);border-color:#ffd43b}
  .heads img.off{filter:grayscale(1) brightness(.55);border-color:#777}
  .btn{font-family:inherit;font-size:calc(var(--ou)*32);padding:calc(var(--ou)*10) calc(var(--ou)*40);border:none;border-radius:calc(var(--ou)*40);cursor:pointer;
       color:#5a2400;background:linear-gradient(#ffe066,#ffb703);box-shadow:0 calc(var(--ou)*6) 0 #c76d00,0 calc(var(--ou)*10) calc(var(--ou)*20) rgba(0,0,0,.35);margin:calc(var(--ou)*6)}
  .btn:active{transform:translateY(calc(var(--ou)*4));box-shadow:0 calc(var(--ou)*2) 0 #c76d00}
  .btn.sec{background:linear-gradient(#ffffff,#dfe7ef);color:#334;box-shadow:0 calc(var(--ou)*6) 0 #8d99a6}
  .help{margin-top:calc(var(--ou)*16);font-size:calc(var(--ou)*19);color:#ffd8b8;line-height:1.55}
  .help b{color:#fff;font-weight:400;background:rgba(255,255,255,.16);padding:0 calc(var(--ou)*8);border-radius:calc(var(--ou)*6)}
  .stats{font-size:calc(var(--ou)*28);margin:calc(var(--ou)*10) 0 calc(var(--ou)*6);line-height:1.5}
  .stats span{color:#ffe35c}
  .best{font-size:calc(var(--ou)*20);color:#ffcf99;margin-bottom:calc(var(--ou)*14)}
  #tb{position:absolute;top:calc(var(--ou)*12);right:calc(var(--ou)*12);display:flex;gap:calc(var(--ou)*8)}
  #tb button{width:calc(var(--ou)*46);height:calc(var(--ou)*46);border-radius:50%;border:none;background:rgba(0,0,0,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  #tb svg{width:55%;height:55%;fill:#fff}
  .ov{position:fixed;z-index:5;border-radius:0;padding:12px;box-sizing:border-box;overflow:auto}
  h1,h2{padding:0 8px}
  h1{font-size:min(calc(var(--ou)*74),11.5vw)}
  body.portrait .ov{background:rgba(24,10,16,.94)}
  .touchOnly{display:none} body.touch .touchOnly{display:inline} body.touch .kbOnly{display:none}
  #bFull.hidden{display:none}
</style>
</head>
<body>
<div id="topbar"></div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="tb" class="hidden">
    <button id="bFull" aria-label="전체화면"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
    <button id="bSound" aria-label="소리"><svg viewBox="0 0 24 24" id="icSound"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 8v8a4.5 4.5 0 002.5-4zM14 3.2v2.1a7 7 0 010 13.4v2.1a9 9 0 000-17.6z"/></svg></button>
    <button id="bPause" aria-label="일시정지"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
  </div>
  <div class="ov" id="ovTitle">
    <h1>아기 공룡 대탈출!</h1>
    <div class="sub">화산이 폭발했어요! 공룡 친구들을 구하면서 함께 도망쳐요</div>
    <div class="heads" id="titleHeads"></div>
    <button class="btn" id="bStart">시작하기</button>
    <div class="help">
      <span class="kbOnly">점프 <b>스페이스 · ↑</b> 또는 <b>화면 왼쪽 클릭</b> (공중에서 한 번 더 누르면 2단 점프)<br>
      슬라이드 <b>↓</b> (누르고 있기)<br></span>
      <span class="touchOnly">점프 <b>화면 왼쪽 터치</b> (공중에서 한 번 더 → 2단 점프)<br>
      슬라이드 <b>화면 오른쪽 누르고 있기</b><br></span>
      공룡알을 모으고 열매로 체력을 채워요. 체력이 다 떨어지면 용암에 따라잡혀요!
    </div>
    <div class="best" id="bestT" style="margin-top:calc(var(--u)*10)"></div>
  </div>
  <div class="ov hidden" id="ovPause">
    <h2>잠깐 쉬어요</h2>
    <div style="height:calc(var(--u)*20)"></div>
    <button class="btn" id="bResume">계속하기</button>
    <button class="btn sec" id="bQuit">처음으로</button>
  </div>
  <div class="ov hidden" id="ovEnd">
    <h2 id="endTitle"></h2>
    <div class="sub" id="endSub"></div>
    <div class="heads" id="endHeads"></div>
    <div class="stats" id="endStats"></div>
    <div class="best" id="endBest"></div>
    <div><button class="btn" id="bRetry">다시 하기</button><button class="btn sec" id="bHome">처음으로</button></div>
  </div>
</div>
<div id="pad">
  <div id="padBtns">
    <button id="pJump">점프<small>두 번 누르면 2단 점프</small></button>
    <button id="pSlide">슬라이드<small>누르고 있기</small></button>
  </div>
  <div id="padTip">가로로 돌리면 화면이 더 커져요</div>
</div>

  const skin = '#f6caa6', shirt = '#f39436', dk = '#2f5d4f';
  const arm = (x, y, a, front) => { ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.strokeStyle = front ? shirt : '#d97c26'; ctx.lineWidth = 11; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 22); ctx.stroke(); ell(0, 27, 6, 6, skin); ctx.restore(); };

  const la = fall ? -2.4 : air ? -2.3 : (S.sliding ? -1.3 : Math.sin(ph) * 1.1), lb = fall ? 2.4 : air ? 0.6 : (S.sliding ? -0.4 : Math.sin(ph + Math.PI) * 1.1);
  const legA = air ? -0.9 : (S.sliding ? -1.4 : Math.sin(ph) * 0.9), legB = air ? 0.7 : (S.sliding ? -1.1 : Math.sin(ph + Math.PI) * 0.9);

  ctx.fillStyle = dk; ctx.beginPath(); ctx.moveTo(-8, -58); ctx.lineTo(12, -60); ctx.lineTo(16, -52); ctx.lineTo(6, -50); ctx.lineTo(4, -38); ctx.lineTo(-2, -50); ctx.lineTo(-12, -50); ctx.fill();
  ell(-12, -36, 4, 3, '#cfd8d0'); ell(14, -42, 3, 3, '#cfd8d0');
  ctx.strokeStyle = '#6f6a2c'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-14, -70); ctx.lineTo(-10, -32); ctx.stroke();

  arm(12, -62, la, true);
  ctx.restore();
}
function drawLava() {
  const grab = S.lavaGrab, edge = -40 + (1 - S.hp / 100) * 150 + grab * (PX + 60) + Math.sin(S.t * 2) * 6;
  const top = GY - 150 - grab * 120;
  const g = ctx.createLinearGradient(edge - 160, 0, edge + 30, 0);
  g.addColorStop(0, '#7a1508'); g.addColorStop(0.55, '#e8471a'); g.addColorStop(0.85, '#ff9a2e'); g.addColorStop(1, '#ffd166');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-10, H);

    ctx.lineTo(edge + Math.sin(y * 0.05 + S.t * 6) * 12 - k * k * 90, y);
  }
  ctx.lineTo(-10, top - 40); ctx.closePath(); ctx.fill();
  const glow = ctx.createRadialGradient(edge, GY - 40, 10, edge, GY - 40, 260);
  glow.addColorStop(0, `rgba(255,120,30,${0.35 + 0.35 * (1 - S.hp / 100)})`); glow.addColorStop(1, 'rgba(255,80,20,0)');
  ctx.fillStyle = glow; ctx.fillRect(edge - 260, GY - 300, 520, 400);
  for (let k = 0; k < 7; k++) { const u = (S.t * 0.8 + k / 7) % 1; ell(edge - 30 - k * 12, H - u * (H - top) * 0.9, 6 * (1 - u) + 2, 6 * (1 - u) + 2, '#ffe08a'); }
  if (S.hp < 30 && mode === 'play' && S.state !== 'dead') { ctx.fillStyle = `rgba(255,40,0,${0.12 + 0.1 * Math.sin(S.t * 10)})`; ctx.fillRect(0, 0, W, H); }
}
function drawFollowers() {
  S.friends.forEach((k, i) => {
    const f = FBY[k], fx = PX - 66 * (i + 1) - (k === 'trex' ? 12 : 0);
    const delay = (PX - fx) / Math.max(200, S.speed);
    let y = GY;
    for (let j = S.hist.length - 1; j >= 0; j--) if (S.hist[j].t <= S.t - delay) { y = S.hist[j].y; break; }
    ell(fx, GY, 28 * f.s, 6, 'rgba(0,0,0,.18)');
    drawDino(f, fx, S.state === 'clear' && S.endT > 0.6 ? GY - Math.abs(Math.sin(S.t * 7 + i)) * 40 : y, 0.85, S.t + i * 0.3, S.speed < 40);
  });
}
function drawObjs() {
  for (const o of S.objs) {
    const sx = o.x - S.cam;
    if (sx < -300 || sx > W + 300) {
      if (o.type === 'bomb' && sx > W && sx < W + 700 && !o.dead) { const b = Math.sin(S.t * 14) > 0; ctx.fillStyle = b ? '#ff4d2e' : '#ffd43b'; ctx.beginPath(); ctx.arc(W - 34, o.y, 20, 0, TAU); ctx.fill(); txt('!', W - 34, o.y + 1, 30, '#fff'); }
      continue;
    }
    if (o.type === 'egg' && !o.dead) drawEgg(o, sx);
    else if (o.type === 'heal' && !o.dead) drawHeal(o, sx);
    else if (o.type === 'rock') drawRock(o, sx);
    else if (o.type === 'hang') drawHang(o, sx);
    else if (o.type === 'bomb') { if (!o.dead) fireball(sx, o.y, 20); }
    else if (o.type === 'meteor') {
      const tx = sx; const pulse = 0.5 + 0.5 * Math.sin(S.t * 14);
      ctx.strokeStyle = `rgba(255,60,30,${0.5 + 0.4 * pulse})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(tx, GY, 34, 9, 0, 0, TAU); ctx.stroke();
      if (o.fall < 0 || o.fall < 0.6) txt('!', tx, GY - 40, 34, '#ff4d2e', '#fff', 'center', 6);
      if (o.fall >= 0) fireball(tx, o.my, 24);
    }
    else if (o.type === 'friend' && !o.dead) {
      const f = FBY[o.key];
      ell(sx, GY, 30 * f.s, 7, 'rgba(0,0,0,.2)');
      ctx.save(); ctx.translate(sx, 0); ctx.scale(-1, 1); ctx.translate(-sx, 0);
      drawDino(Object.assign({}, f, { flip: !f.flip }), sx, GY, 0.95, S.t, true); ctx.restore();
      const by = GY - (f.neck ? 200 : 150) * f.s - 20 + Math.sin(S.t * 5) * 4;
      ctx.fillStyle = '#fff'; rr(sx - 58, by - 22, 116, 40, 18); ctx.fill();
      ctx.beginPath(); ctx.moveTo(sx - 8, by + 17); ctx.lineTo(sx + 2, by + 30); ctx.lineTo(sx + 10, by + 17); ctx.fill();
      txt('도와줘!', sx, by - 1, 24, '#d9480f');

  }
}
function drawGoal(sx) {
  const cx = sx + 260;
  const cols = ['#ff6b6b', '#ffa94d', '#ffe066', '#69db7c', '#4dabf7', '#9775fa'];
  cols.forEach((c, i) => { ctx.strokeStyle = c; ctx.globalAlpha = 0.75; ctx.lineWidth = 14; ctx.beginPath(); ctx.arc(cx, GY + 40, 300 - i * 14, Math.PI, TAU); ctx.stroke(); });
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#8a5a34'; ctx.fillRect(sx - 6, GY - 120, 12, 120);
  ctx.fillStyle = '#c98c50'; rr(sx - 80, GY - 160, 160, 56, 12); ctx.fill(); ctx.strokeStyle = '#7a4a24'; ctx.lineWidth = 4; ctx.stroke();
  txt('안전한 숲', sx, GY - 132, 30, '#fff', '#7a4a24', 'center', 5);
  for (let k = 0; k < 10; k++) { const fx = sx + 40 + k * 55, c = cols[k % 6]; ctx.fillStyle = '#4caf50'; ctx.fillRect(fx - 1, GY - 20, 3, 20); for (let p = 0; p < 5; p++) ell(fx + Math.cos(p * 1.26) * 6, GY - 22 + Math.sin(p * 1.26) * 6, 4.5, 4.5, c); ell(fx, GY - 22, 3, 3, '#fff3b0'); }
}
function drawParts(front) {
  for (const p of S.parts) {
    const u = p.life / p.max, a = 1 - u;
    if (p.type === 'dot') { ctx.globalAlpha = a; ell(p.x, p.y, p.size, p.size, p.color); }
    else if (p.type === 'puff') { ctx.globalAlpha = a * 0.6; ell(p.x, p.y, p.size * (1 + u * 1.5), p.size * (1 + u * 1.5), '#e8cfa8'); }

    else if (p.type === 'conf') { ctx.globalAlpha = Math.min(1, a * 3); ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + p.life * 6); ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2 * Math.abs(Math.cos(p.life * 7))); ctx.restore(); }
    else if (p.type === 'text') { ctx.globalAlpha = Math.min(1, a * 2); txt(p.text, p.x, p.y, 28, p.color, 'rgba(0,0,0,.55)', 'center', 6); }

  ctx.globalAlpha = 1;
}
function drawAsh() {
  for (const a of S.ash) {
    if (a.ember) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(S.t * 8 + a.ph); ell(a.x, a.y, a.s, a.s, '#ffab4a'); }
    else { ctx.globalAlpha = 0.5; ell(a.x, a.y, a.s, a.s, '#8a7f80'); }

}
function hudGroup(ax, ay, fn) { ctx.save(); ctx.translate(ax, ay); ctx.scale(HUDS, HUDS); ctx.translate(-ax, -ay); fn(); ctx.restore(); }
function drawHUD() {
  hudGroup(0, 0, hudLeft);
  if (PORTRAIT) { ctx.save(); ctx.translate(W / 2, H - 62 * HUDS); ctx.scale(HUDS, HUDS); ctx.translate(-540, -33); hudProg(); ctx.restore(); }
  else { ctx.save(); ctx.translate(-Math.min(30, TBR - 124), 0); ctx.scale(1, 1); hudGroup(540, 0, () => { ctx.translate(540, 33); ctx.scale(0.88, 0.88); ctx.translate(-540, -33); hudProg(); }); ctx.restore(); }

}
function hudLeft() {
  // HP
  ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(18, 16, 300, 34, 17); ctx.fill();
  const hp = clamp(S.hp / 100, 0, 1);
  const hg = ctx.createLinearGradient(50, 0, 314, 0); hg.addColorStop(0, hp < 0.3 ? '#ff4d4d' : '#ff8a5c'); hg.addColorStop(1, hp < 0.3 ? '#ff8a5c' : '#ffd43b');
  if (hp > 0) { ctx.fillStyle = hg; rr(48, 21, Math.max(24, 264 * hp), 24, 12); ctx.fill(); }
  ctx.save(); ctx.translate(36, 33); const hb = 1 + (S.hp < 30 ? 0.15 * Math.abs(Math.sin(S.t * 8)) : 0); ctx.scale(hb, hb);
  ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.moveTo(0, 10); ctx.bezierCurveTo(-22, -4, -10, -20, 0, -8); ctx.bezierCurveTo(10, -20, 22, -4, 0, 10); ctx.fill(); ctx.restore();

  let ax = 36;
  for (const k of S.friends) {
    const f = FBY[k]; headImg(IM[k], ax, 78, 17, f.color, f.flip);
    let cd = 0;
    if (k === 'trice') cd = S.shieldCd / 10; if (k === 'trex') cd = S.dashT > 0 ? 0 : S.dashCd / 20; if (k === 'brachio') cd = S.healCd / 5;
    if (cd > 0) { ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.moveTo(ax, 78); ctx.arc(ax, 78, 21, -Math.PI / 2, -Math.PI / 2 + TAU * cd); ctx.fill(); }

}
function hudProg() {
  const x0 = 360, x1 = 720, py = 33, prog = clamp((S.cam + PX) / (GOAL * PXM), 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(x0 - 14, py - 10, x1 - x0 + 28, 20, 10); ctx.fill();
  ctx.fillStyle = '#ffd43b'; rr(x0 - 8, py - 5, (x1 - x0 + 16) * prog, 10, 5); ctx.fill();
  for (const f of FRIENDS) { const fx = lerp(x0, x1, f.at / GOAL); ctx.globalAlpha = S.friends.includes(f.key) ? 1 : 0.6; headImg(IM[f.key], fx, py, 11, S.friends.includes(f.key) ? f.color : '#666', f.flip); ctx.globalAlpha = 1; }

}
function hudScore() {

function hudButtons() {
  ctx.globalAlpha = 0.28;
  ell(78, H - 64, 46, 46, '#fff'); ell(W - 78, H - 64, 46, 46, S.slideHeld ? '#ffd43b' : '#fff');
  ctx.globalAlpha = 0.9;
  txt('점프', 78, H - 64, 22, '#fff', 'rgba(0,0,0,.4)', 'center', 4); txt('슬라이드', W - 78, H - 64, 19, '#fff', 'rgba(0,0,0,.4)', 'center', 4);
  ctx.globalAlpha = 1;
}
function drawBanner() {
  if (S.banner) {
    const b = S.banner, inT = Math.min(1, b.t / 0.3), outT = Math.min(1, Math.max(0, (3.2 - b.t) / 0.3)), k = Math.min(inT, outT);

function render() {

/* ---------------- loop ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;

requestAnimationFrame(loop);
